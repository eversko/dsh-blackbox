name: Bug report
description: Report a reproducible Black Box problem without sharing private session content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste prompts, reasoning, credentials, tool arguments, tool results, raw identifiers, or private paths.
  - type: input
    id: version
    attributes:
      label: Black Box version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: DSH and Node versions
      placeholder: DSH 0.1.1-rc.2; Node 22.22.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use the smallest metadata-only reproduction possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
