name: Publish DSH Black Box

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the one-time NPM_TOKEN bootstrap before trusted publishing is configured
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-dsh-blackbox
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish tagged package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release

    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install isolated publishing CLI
        shell: bash
        run: |
          set -euo pipefail
          npm_root="${RUNNER_TEMP}/npm-cli-12.0.2"
          npm install --prefix "${npm_root}" --ignore-scripts --no-audit --no-fund npm@12.0.2
          test "$("${npm_root}/node_modules/.bin/npm" --version)" = "12.0.2"
          echo "${npm_root}/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Verify npm CLI
        shell: bash
        run: test "$(npm --version)" = "12.0.2"

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          package_version="$(npm pkg get version | tr -d '"')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Install exact dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm test
          npm audit --audit-level=moderate
          npm publish --dry-run --ignore-scripts

      - name: Bootstrap first publication
        if: inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NODE_AUTH_TOKEN}"
          npm publish --access public --provenance

      - name: Publish with npm trusted publishing
        if: ${{ !inputs.bootstrap }}
        run: npm publish --access public --provenance
