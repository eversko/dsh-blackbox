name: Feature idea
description: Propose a focused improvement for DSH incident capture or analysis.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a great outcome look like?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy boundary
      options:
        - label: This can preserve the metadata-only default.
          required: true
